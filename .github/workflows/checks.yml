name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: npm ci
      - run: npm run check:js
      - run: npm run test:unit
      - run: npm run build
      - run: npm run verify:release
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/wc-dynamic-notice-toasts
          slug: dynamic-notice-toasts-for-woocommerce
          strict: true
      - uses: actions/upload-artifact@v4
        with:
          name: wc-dynamic-notice-toasts
          path: dist/wc-dynamic-notice-toasts.zip
